services:
    web:
        image: node:20
        container_name: my-next-app
        working_dir: /app
        ports:
            - "3000:3000"
        environment:
            - ENV=production
            - DATABASE_HOST=db
            - DATABASE_PORT=3306
            - DATABASE_USER=myuser
            - DATABASE_PASSWORD=password
            - DATABASE_NAME=nattsun
        depends_on:
            - db
        volumes:
            - ./my-next-app:/app
            - /app/node_modules 
        command: sleep infinity
        tty: true
        stdin_open: true


    db:
        image: mysql:8.4
        environment:
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_USER=myuser
            - MYSQL_PASSWORD=password
            - MYSQL_DATABASE=nattsun
        volumes:
            - db-data:/var/lib/mysql
        ports:
            - "3306:3306"

volumes:
    db-data:
