services:
  web:
    image: node:22
    working_dir: /app/my-next-app
    volumes:
      - .:/app
      - node_modules:/app/my-next-app/node_modules
    ports:
      - "3000:3000"
    command: sleep infinity

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  node_modules:
  mysql_data: